# 서울 121곳 실시간 혼잡도 — 수집은 매시간, main 커밋은 하루 한 번 (일반 오픈API는 호출 횟수 제한 없음)
# 매시간: 수집한 기록을 congestion-pending 브랜치(커밋 하나를 덮어씀)에 보관 → 한국시간 23시 실행에서
#         data/seoul_congestion_log.csv에 합쳐(같은 시각·장소는 건너뜀) main에 커밋하고 임시 기록을 비운다
# 수동 실행(workflow_dispatch)은 그 자리에서 합쳐 커밋한다(테스트·복구용)
# 시크릿 필요: SEOUL_KEY (서울열린데이터광장 data.seoul.go.kr 발급 — 지하철 갱신과 같은 키)
name: collect-congestion

on:
  schedule:
    - cron: '5 * * * *'         # 매시간 5분 (정각 직후 혼잡도 스냅샷)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-congestion     # 앞 실행이 끝난 뒤에 다음 실행 (임시 기록이 꼬이지 않게)
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      PENDING: pending/seoul_congestion_pending.csv
      PBRANCH: congestion-pending
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas

      - name: 임시 기록 가져오기
        run: |
          mkdir -p pending
          if git fetch --depth=1 origin "$PBRANCH" 2>/dev/null; then
            git show FETCH_HEAD:seoul_congestion_pending.csv > "$PENDING"
            echo "임시 기록 $(($(wc -l < "$PENDING") - 1))줄"
          fi

      - name: 혼잡도 수집(임시 기록에 쌓기)
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
          CONGESTION_OUT: ${{ env.PENDING }}
        run: python scripts/collect_seoul.py

      - name: 임시 기록 보관(별도 브랜치, 커밋 하나로 덮어쓰기)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          save_pending() {
            blob=$(git hash-object -w "$PENDING")
            tree=$(printf '100644 blob %s\tseoul_congestion_pending.csv\n' "$blob" | git mktree)
            c=$(git commit-tree "$tree" -m "임시 수집 기록 (하루 한 번 main에 합침)")
            git push -f origin "$c:refs/heads/$PBRANCH"
          }
          save_pending
          H=$(TZ=Asia/Seoul date +%H)
          if [ "$H" != "23" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "합치기는 23시에 합니다(지금 ${H}시)"; exit 0
          fi
          python scripts/flush_congestion.py "$PENDING"
          git add data/seoul_congestion_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "🤖 서울 혼잡도 수집 $(TZ=Asia/Seoul date +%Y-%m-%d) 하루치"
            ok=0
            for i in 1 2 3; do
              if git push; then ok=1; break; fi
              sleep $i; git pull --rebase origin main
            done
            if [ $ok != 1 ]; then echo "main 푸시 실패: 임시 기록을 남겨 두고 다음 23시에 다시 합칩니다"; exit 1; fi
          fi
          python scripts/flush_congestion.py "$PENDING" --clear
          save_pending
