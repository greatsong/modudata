name: probe
on:
  workflow_dispatch:
    inputs:
      code:
        description: movieCd
        default: '20255393'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - env:
          KOBIS_KEY: ${{ secrets.KOBIS_KEY }}
          PROBE_CODE: ${{ inputs.code }}
        run: for i in 1 2 3; do python scripts/_probe_kobis_fields.py && break; sleep 20; done
