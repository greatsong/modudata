# 10장 자동 실행 설정 - 저장소의 .github/workflows/ 폴더에 두어야 동작합니다.
# 시크릿 필요: SEOUL_KEY (서울 열린데이터광장 data.seoul.go.kr 발급)
name: collect-congestion

on:
  schedule:
    - cron: "5 * * * *"        # 매시간 5분에 깨어나기 (깃허브 시계는 UTC)
  workflow_dispatch:            # 손으로 실행하는 버튼

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests pandas

      - name: 혼잡도 수집
        env:
          SEOUL_KEY: ${{ secrets.SEOUL_KEY }}
        run: python codes/ch10/collect.py

      - name: 변경분이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seoul_congestion_log.csv
          if ! git diff --cached --quiet; then
            git commit -m "서울 혼잡도 수집 $(TZ=Asia/Seoul date +%Y-%m-%d_%H:%M)"
            git push
          fi
